[project]
name = "mcp-for-sheets"
dynamic = ["version"]
description = "An MCP server that lets AI assistants create, read, and modify Google Sheets spreadsheets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
    "google-auth>=2.28.1",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.117.0",
]
[[project.authors]]
name = "Xing Wu"
email = "xingwu.cs@gmail.com"

[project.urls]
"Homepage" = "https://github.com/Rheosta561/Sheet-MCP"
"Bug Tracker" = "https://github.com/Rheosta561/Sheet-MCP/issues"
"Repository" = "https://github.com/Rheosta561/Sheet-MCP.git"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern = "default"
strict = true
fallback-version = "0.0.0"

[project.scripts]
mcp-for-sheets = "mcp_for_sheets:main"
